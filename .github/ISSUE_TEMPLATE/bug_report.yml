name: Bug report
description: Report a reproducible problem in KB-1 Local
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve KB-1 Local. Do not include vault content,
        credentials, relay tokens, or other private data. Report security
        vulnerabilities through the private process in SECURITY.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed private data and credentials from this report.
          required: true
  - type: input
    id: revision
    attributes:
      label: KB-1 Local revision
      description: Commit SHA, branch, or release tag.
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Source checkout
        - Docker
        - Setup skill or user service
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, and relevant MCP client.
      placeholder: macOS 15, Node 24.4.1, Claude Code 1.x
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence that reproduces the problem.
      placeholder: |
        1. Start KB-1 with ...
        2. Open or call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Remove vault contents, tokens, and private paths.
      render: shell
