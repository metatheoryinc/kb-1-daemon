name: Feature request
description: Propose a focused improvement to KB-1 Local
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request is for the open-source KB-1 Local project.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or agent workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior you would like, without prescribing implementation unless it matters.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Local web app
        - MCP or agent workflow
        - Local API
        - Vault format or filesystem behavior
        - Setup, packaging, or service management
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe workarounds or related tools you tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Remove private vault data and credentials.
