services:
  daemon:
    build:
      context: .
      dockerfile: apps/daemon/Dockerfile
    image: kb-2-daemon:dev
    container_name: kb-2-daemon-dev
    environment:
      KB2_HOME: /data/kb2
      KB2_HOST: 0.0.0.0
      KB2_PORT: 7382
    ports:
      - "17382:7382"
    volumes:
      - ./.kb2-docker:/data/kb2
