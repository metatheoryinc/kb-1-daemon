services:
  daemon:
    build:
      context: .
      dockerfile: apps/daemon/Dockerfile
    image: kb-1-daemon:dev
    container_name: kb-1-daemon-dev
    environment:
      KB1_HOME: /data/kb1
      KB1_HOST: 0.0.0.0
      KB1_PORT: 7382
    ports:
      - "17382:7382"
    volumes:
      - ./.kb1-docker:/data/kb1
