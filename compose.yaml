services:
  daemon:
    build:
      context: .
      dockerfile: apps/daemon/Dockerfile
    image: kb-1-daemon:dev
    container_name: kb-1-daemon-dev
    environment:
      KB1_HOME: ${KB1_DOCKER_CONTAINER_HOME:-/data/kb1}
      KB1_HOST: 0.0.0.0
      KB1_PORT: 7382
    ports:
      - "127.0.0.1:17382:7382"
    volumes:
      - ${KB1_DOCKER_HOST_HOME:-./.kb1-docker}:${KB1_DOCKER_CONTAINER_HOME:-/data/kb1}
