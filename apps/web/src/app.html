<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KB-1 Local</title>

    <script>
      // Pre-hydration color-mode resolution. Reads the persisted
      // `colorMode` from the same `kb1:app-state` localStorage key the
      // app-state store writes, falling back to the legacy `kb2:app-state`
      // slot during upgrades; defaults to `'system'` when missing or
      // malformed; resolves `'system'` against `prefers-color-scheme`.
      // Writes `<html class="dark">` so Tailwind's `.dark` variant is
      // active before the first paint, and `<html data-rd-mode>` so the
      // design-token dark block (`[data-rd-mode='dark']`, which fills the
      // editor shell's `--rd-bg` viewport surface) resolves on the first
      // frame too — `<html>` is `:root`, so the tokens cascade to the whole
      // tree. The root layout's reactive effect re-mirrors `data-rd-mode`
      // onto `<body>` post-mount to track live toggles. Inline and
      // synchronous by design: any flash is a regression.
      (function () {
        try {
          var mode = 'system';
          var raw =
            window.localStorage.getItem('kb1:app-state') ||
            window.localStorage.getItem('kb2:app-state');
          if (raw) {
            var blob = JSON.parse(raw);
            var v = blob && blob.colorMode;
            if (v === 'light' || v === 'dark' || v === 'system') mode = v;
          }
          var resolved = mode;
          if (mode === 'system') {
            resolved =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.classList.toggle('dark', resolved === 'dark');
          document.documentElement.dataset.rdMode = resolved;
        } catch (_) {
          // Storage / JSON / matchMedia failed — leave defaults (light).
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
